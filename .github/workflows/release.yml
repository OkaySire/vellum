name: Release to NuGet

on:
  release:
    types: [published]

# Never cancel an in-flight publish — partial pushes leave the feed in a weird state.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: pack-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Derive package version from the release tag.
      # Tag "v0.1.0-preview.1" → VELLUM_VERSION="0.1.0-preview.1".
      # MSBuild splits /p:Version into VersionPrefix/VersionSuffix automatically.
      - name: Derive version from tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if [ -z "${VERSION}" ]; then
            echo "::error::Release tag is empty — cannot derive package version."
            exit 1
          fi
          echo "VELLUM_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Publishing Vellum ${VERSION}"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:Version=${{ env.VELLUM_VERSION }}

      - name: Test (sanity)
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./artifacts /p:Version=${{ env.VELLUM_VERSION }}

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*
          retention-days: 90

      # Fail-safe: if NUGET_API_KEY is not configured, skip publish with a clear
      # warning instead of failing the workflow. The human runs the release.
      - name: Check NUGET_API_KEY
        id: check_key
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::warning::NUGET_API_KEY not configured — skipping nuget.org publish. Packages are available as workflow artifacts."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      # dotnet nuget push picks up the matching .snupkg next to each .nupkg
      # automatically when they share the same directory, so a single push covers
      # symbols as well. --skip-duplicate makes re-runs idempotent.
      - name: Push to nuget.org
        if: steps.check_key.outputs.has_key == 'true'
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
